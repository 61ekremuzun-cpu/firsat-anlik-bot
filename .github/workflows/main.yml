name: Fırsat Anlık Otomatik Tarayıcı

on:
  schedule:
    # UTC zamanına göre her 30 dakikada bir çalışır
    - cron: '*/30 * * * *'
  workflow_dispatch: # GitHub arayüzünden elle tetikleme butonu

jobs:
  run-deal-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Proje Kodlarını Çek
        uses: actions/checkout@v3

      - name: Python Ortamını Hazırla
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Bağımlılıkları Yükle
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Botu Çalıştır
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
        run: python bot.py
